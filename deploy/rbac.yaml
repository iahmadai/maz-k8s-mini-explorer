apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mini-explorer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mini-explorer-reader
rules:
  - apiGroups: [""]
    resources: [pods, events, endpoints, services]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mini-explorer-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mini-explorer-reader
subjects:
  - kind: ServiceAccount
    name: k8s-mini-explorer
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mini-explorer
  namespace: default
  labels:
    app: k8s-mini-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mini-explorer
  template:
    metadata:
      labels:
        app: k8s-mini-explorer
    spec:
      serviceAccountName: k8s-mini-explorer
      containers:
        - name: explorer
          image: k8s-mini-explorer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mini-explorer
  namespace: default
  labels:
    app: k8s-mini-explorer
spec:
  selector:
    app: k8s-mini-explorer
  ports:
    - port: 8080
      targetPort: http
      name: http
